<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>w1nterxt - 个人主页</title>
    <style>
        /* ===== CSS Variables — 改这里就能换主题 ===== */
        :root {
            --bg: #0f0f1a;
            --bg-card: #1a1a2e;
            --text: #e0e0e0;
            --text-dim: #8892b0;
            --accent: #6c63ff;
            --accent-glow: rgba(108, 99, 255, 0.3);
            --border: rgba(255, 255, 255, 0.06);
            --radius: 12px;
            --max-width: 900px;
        }

        /* ===== Reset ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: radial-gradient(ellipse at 50% 0%, #1a1a3e 0%, var(--bg) 60%);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
            overflow-x: hidden;
            cursor: none;
        }

        /* 星系指针 */
        .cursor-canvas {
            position: fixed; z-index: 9999;
            pointer-events: none;
            top: 0; left: 0;
        }

        /* ===== 星空背景 ===== */
        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }

        /* ===== 主容器 ===== */
        .container {
            position: relative; z-index: 1;
            max-width: var(--max-width); margin: 0 auto; padding: 0 24px;
        }

        /* ===== 导航 ===== */
        nav {
            display: flex; justify-content: flex-end; gap: 28px;
            padding: 20px 0; font-size: 0.95rem;
            position: sticky; top: 0; z-index: 10;
            backdrop-filter: blur(10px);
            background: rgba(15, 15, 26, 0.6);
            margin: 0 -24px; padding: 16px 24px;
        }
        nav a { color: var(--text-dim); text-decoration: none; transition: color 0.2s; cursor: none; }
        nav a:hover { color: var(--accent); }
        a, button, .project-card { cursor: none !important; }

        /* ===== Hero ===== */
        .hero {
            padding: 100px 0 60px; text-align: center;
        }
        .hero .avatar {
            width: 96px; height: 96px; border-radius: 50%;
            border: 3px solid var(--accent);
            box-shadow: 0 0 24px var(--accent-glow);
            margin-bottom: 20px; display: block;
            margin-left: auto; margin-right: auto;
        }
        .hero h1 {
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            font-weight: 800; margin-bottom: 12px;
            background: linear-gradient(135deg, var(--accent), #a78bfa, #67e8f9);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hero .subtitle {
            color: var(--text-dim); font-size: 1.15rem; margin-bottom: 8px;
        }
        .hero .tagline {
            color: var(--text-dim); font-size: 0.95rem;
            opacity: 0.7; max-width: 500px; margin: 0 auto;
        }

        /* ===== 区块标题 ===== */
        .section {
            padding: 60px 0;
        }
        .section-title {
            font-size: 1.5rem; font-weight: 700; margin-bottom: 32px;
            display: flex; align-items: center; gap: 12px;
        }
        .section-title::after {
            content: ""; flex: 1; height: 1px;
            background: var(--border); max-width: 200px;
        }

        /* ===== 关于我 ===== */
        .about-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 32px;
        }
        .about-card p { margin-bottom: 12px; }
        .about-card p:last-child { margin-bottom: 0; }

        /* ===== 技能标签 ===== */
        .skills-grid {
            display: flex; flex-wrap: wrap; gap: 10px;
        }
        .skill-tag {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 20px; padding: 8px 18px;
            font-size: 0.9rem; color: var(--text-dim);
            transition: all 0.25s; cursor: default;
        }
        .skill-tag:hover {
            border-color: var(--accent); color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* ===== 项目卡片 ===== */
        .projects-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        .project-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 28px;
            transition: transform 0.25s, box-shadow 0.25s;
            text-decoration: none; color: var(--text); display: block;
        }
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px var(--accent-glow);
            border-color: var(--accent);
        }
        .project-card h3 { font-size: 1.1rem; margin-bottom: 8px; }
        .project-card p {
            color: var(--text-dim); font-size: 0.9rem; line-height: 1.6;
        }
        .project-card .tag-row {
            display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px;
        }
        .project-card .mini-tag {
            font-size: 0.75rem; padding: 3px 10px;
            border-radius: 10px; background: rgba(108, 99, 255, 0.15);
            color: var(--accent);
        }

        /* ===== 联系 ===== */
        .contact-links {
            display: flex; flex-wrap: wrap; gap: 16px;
        }
        .contact-link {
            display: flex; align-items: center; gap: 10px;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 14px 22px;
            text-decoration: none; color: var(--text);
            transition: all 0.25s; font-size: 0.95rem;
        }
        .contact-link:hover {
            border-color: var(--accent); color: var(--accent);
        }
        .contact-link svg { width: 20px; height: 20px; flex-shrink: 0; }

        /* ===== Footer ===== */
        footer {
            text-align: center; padding: 40px 0 30px;
            color: var(--text-dim); font-size: 0.85rem; opacity: 0.6;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            nav { justify-content: center; gap: 20px; }
            .hero { padding: 60px 0 40px; }
            .section { padding: 40px 0; }
            .projects-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- 星系指针 -->

    <!-- 星空 + 指针脚本 -->
    <script>
    (function() {
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let mouse = { x: -999, y: -999 };
        const count = 180;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function createStars() {
            stars = [];
            for (let i = 0; i < count; i++) {
                const r = Math.random() < 0.08
                    ? Math.random() * 1.2 + 1.8   // 少量亮星
                    : Math.random() * 1.1 + 0.4;  // 多数暗星
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r,
                    baseAlpha: r > 1.5 ? 0.5 : 0.2,
                    speedX: (Math.random() - 0.5) * 0.15,
                    speedY: (Math.random() - 0.5) * 0.15,
                    pulse: Math.random() * Math.PI * 2,
                    pulseSpeed: 0.005 + Math.random() * 0.02,
                    hue: Math.random() < 0.2 ? 260 : 210 + Math.random() * 50
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 连线（近的亮星之间）
            for (let i = 0; i < stars.length; i++) {
                if (stars[i].r < 1.5) continue;
                for (let j = i + 1; j < stars.length; j++) {
                    if (stars[j].r < 1.5) continue;
                    const dx = stars[i].x - stars[j].x;
                    const dy = stars[i].y - stars[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120) {
                        const alpha = (1 - dist / 120) * 0.12;
                        ctx.beginPath();
                        ctx.moveTo(stars[i].x, stars[i].y);
                        ctx.lineTo(stars[j].x, stars[j].y);
                        ctx.strokeStyle = `rgba(140, 130, 255, ${alpha})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }

            for (const s of stars) {
                s.pulse += s.pulseSpeed;
                s.x += s.speedX;
                s.y += s.speedY;

                // 边界回弹
                if (s.x < -10) s.x = canvas.width + 10;
                if (s.x > canvas.width + 10) s.x = -10;
                if (s.y < -10) s.y = canvas.height + 10;
                if (s.y > canvas.height + 10) s.y = -10;

                const alpha = s.baseAlpha + 0.25 * Math.sin(s.pulse);
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${s.hue}, 60%, 80%, ${alpha})`;
                ctx.fill();

                // 亮星加光晕
                if (s.r > 1.3) {
                    const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 3);
                    glow.addColorStop(0, `hsla(${s.hue}, 80%, 75%, ${alpha * 0.4})`);
                    glow.addColorStop(1, 'transparent');
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
                    ctx.fillStyle = glow;
                    ctx.fill();
                }
            }

            // 鼠标吸引：靠近指针的星星微微发光
            if (mouse.x > -500) {
                for (const s of stars) {
                    const dx = s.x - mouse.x;
                    const dy = s.y - mouse.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 150) {
                        const strength = (1 - dist / 150) * 0.5;
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r + 2, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(180, 160, 255, ${strength})`;
                        ctx.fill();
                    }
                }
            }

            requestAnimationFrame(draw);
        }

        resize();
        createStars();
        draw();
        window.addEventListener('resize', () => { resize(); createStars(); });
        canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        canvas.addEventListener('mouseleave', () => { mouse.x = -999; mouse.y = -999; });
    })();
    </script>

    <!-- 星系指针 -->
    <script>
    (function() {
        const c = document.getElementById('cursorCanvas');
        const ctx = c.getContext('2d');
        let mx = -200, my = -200;
        let smx = -200, smy = -200;
        let time = 0;
        let targetProgress = 0;    // 目标: 0=普通, 1=悬停
        let progress = 0;          // 当前插值
        const size = 120;

        c.width = size; c.height = size;

        document.addEventListener('mousemove', e => {
            mx = e.clientX; my = e.clientY;
        });
        document.addEventListener('mouseleave', () => {
            mx = -200; my = -200;
        });

        // 悬停检测
        document.querySelectorAll('a, button, .project-card').forEach(el => {
            el.addEventListener('mouseenter', () => { targetProgress = 1; });
            el.addEventListener('mouseleave', () => { targetProgress = 0; });
        });

        function lerp(a, b, t) { return a + (b - a) * t; }

        function draw(t) {
            time = t * 0.001;
            smx += (mx - smx) * 0.15;
            smy += (my - smy) * 0.15;
            progress += (targetProgress - progress) * 0.07;  // 平滑过渡

            const cx = smx, cy = smy;
            c.style.left = (cx - size/2) + 'px';
            c.style.top  = (cy - size/2) + 'px';

            ctx.clearRect(0, 0, size, size);
            if (mx < -100) { requestAnimationFrame(draw); return; }

            const mid = size / 2;
            const p = progress;

            // === 基础尺寸（普通小 → 悬停大）===
            const scale = lerp(0.75, 1.8, p);
            const ringR  = lerp(12, 26, p);
            const ringR2 = lerp(7, 16, p);

            // === 光晕 ===
            const glowR = lerp(14, ringR + 14, p);
            const glowAlpha = lerp(0.12, 0.3, p);
            const glow = ctx.createRadialGradient(mid, mid, 0, mid, mid, glowR);
            glow.addColorStop(0, `rgba(130,100,255,${glowAlpha})`);
            glow.addColorStop(0.5, `rgba(100,70,240,${glowAlpha * 0.25})`);
            glow.addColorStop(1, 'transparent');
            ctx.fillStyle = glow;
            ctx.beginPath(); ctx.arc(mid, mid, glowR, 0, Math.PI * 2); ctx.fill();

            // === 星环1 (外环) ===
            const ring1Alpha = lerp(0.2, 0.7, p);
            ctx.save();
            ctx.translate(mid, mid);
            ctx.rotate(-0.6);
            ctx.scale(1, 0.35);
            ctx.strokeStyle = `rgba(160,130,255,${ring1Alpha})`;
            ctx.lineWidth = 1.2;
            ctx.beginPath(); ctx.arc(0, 0, ringR, 0, Math.PI * 2); ctx.stroke();

            // 环上光点（数量随 p 增多：2 → 6）
            const dotCount1 = Math.round(lerp(2, 6, p));
            const dotAlpha1 = lerp(0.35, 0.95, p);
            for (let i = 0; i < dotCount1; i++) {
                const angle = time * (0.4 + p * 0.6) + (i / dotCount1) * Math.PI * 2;
                const rx = Math.cos(angle) * ringR;
                const ry = Math.sin(angle) * ringR;
                ctx.beginPath(); ctx.arc(rx, ry, lerp(1, 2.2, p), 0, Math.PI * 2);
                ctx.fillStyle = `rgba(200,170,255,${dotAlpha1})`; ctx.fill();
            }
            ctx.restore();

            // === 星环2 (内环，悬停时才明显) ===
            const ring2Alpha = lerp(0.05, 0.5, p);
            ctx.save();
            ctx.translate(mid, mid);
            ctx.rotate(1.2);
            ctx.scale(1, 0.25);
            ctx.strokeStyle = `rgba(140,120,230,${ring2Alpha})`;
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(0, 0, ringR2, 0, Math.PI * 2); ctx.stroke();

            const dotCount2 = Math.round(lerp(1, 4, p));
            const dotAlpha2 = lerp(0.15, 0.8, p);
            for (let i = 0; i < dotCount2; i++) {
                const angle = -time * (0.6 + p * 0.7) + (i / dotCount2) * Math.PI * 2 + 0.5;
                const rx = Math.cos(angle) * ringR2;
                const ry = Math.sin(angle) * ringR2;
                ctx.beginPath(); ctx.arc(rx, ry, lerp(0.8, 1.8, p), 0, Math.PI * 2);
                ctx.fillStyle = `rgba(180,150,240,${dotAlpha2})`; ctx.fill();
            }
            ctx.restore();

            // === 悬停专属：外围粒子环 ===
            if (p > 0.05) {
                const sparkCount = Math.floor(lerp(0, 8, p));
                const sparkAlpha = lerp(0, 0.6, p);
                const sparkR = ringR + 12;
                for (let i = 0; i < sparkCount; i++) {
                    const angle = time * 1.5 + i * (Math.PI * 2 / sparkCount);
                    const sx = mid + Math.cos(angle) * sparkR * (0.9 + 0.1 * Math.sin(time * 3 + i));
                    const sy = mid + Math.sin(angle) * sparkR * (0.9 + 0.1 * Math.cos(time * 2.5 + i));
                    ctx.beginPath(); ctx.arc(sx, sy, 1.2, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${sparkAlpha * (0.5 + 0.5 * Math.sin(time * 4 + i))})`; ctx.fill();
                }
            }

            // === 中心星 ===
            const starInner = lerp(4, 8, p);
            const starOuter = lerp(8, 14, p);
            const starGlow = ctx.createRadialGradient(mid, mid, 0, mid, mid, starOuter);
            starGlow.addColorStop(0, '#fff');
            starGlow.addColorStop(0.25, `rgba(200,170,255,${lerp(0.6, 1, p)})`);
            starGlow.addColorStop(1, 'transparent');
            ctx.fillStyle = starGlow;
            ctx.beginPath(); ctx.arc(mid, mid, starOuter, 0, Math.PI * 2); ctx.fill();

            // 中心实心点
            ctx.beginPath(); ctx.arc(mid, mid, lerp(2, 3, p), 0, Math.PI * 2);
            ctx.fillStyle = '#fff'; ctx.fill();

            requestAnimationFrame(draw);
        }

        requestAnimationFrame(draw);
    })();
    </script>
</body>
