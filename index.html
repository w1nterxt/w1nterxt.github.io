<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>w1nterxt - 个人主页</title>
    <style>
        /* ===== CSS Variables — 改这里就能换主题 ===== */
        :root {
            --bg: #0f0f1a;
            --bg-card: #1a1a2e;
            --text: #e0e0e0;
            --text-dim: #8892b0;
            --accent: #6c63ff;
            --accent-glow: rgba(108, 99, 255, 0.3);
            --border: rgba(255, 255, 255, 0.06);
            --radius: 12px;
            --max-width: 900px;
        }

        /* ===== Reset ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== 星空背景 ===== */
        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }

        /* ===== 主容器 ===== */
        .container {
            position: relative; z-index: 1;
            max-width: var(--max-width); margin: 0 auto; padding: 0 24px;
        }

        /* ===== 导航 ===== */
        nav {
            display: flex; justify-content: flex-end; gap: 28px;
            padding: 20px 0; font-size: 0.95rem;
            position: sticky; top: 0; z-index: 10;
            backdrop-filter: blur(10px);
            background: rgba(15, 15, 26, 0.6);
            margin: 0 -24px; padding: 16px 24px;
        }
        nav a { color: var(--text-dim); text-decoration: none; transition: color 0.2s; }
        nav a:hover { color: var(--accent); }

        /* ===== Hero ===== */
        .hero {
            padding: 100px 0 60px; text-align: center;
        }
        .hero h1 {
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            font-weight: 800; margin-bottom: 12px;
            background: linear-gradient(135deg, var(--accent), #a78bfa, #67e8f9);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hero .subtitle {
            color: var(--text-dim); font-size: 1.15rem; margin-bottom: 8px;
        }
        .hero .tagline {
            color: var(--text-dim); font-size: 0.95rem;
            opacity: 0.7; max-width: 500px; margin: 0 auto;
        }

        /* ===== 区块标题 ===== */
        .section {
            padding: 60px 0;
        }
        .section-title {
            font-size: 1.5rem; font-weight: 700; margin-bottom: 32px;
            display: flex; align-items: center; gap: 12px;
        }
        .section-title::after {
            content: ""; flex: 1; height: 1px;
            background: var(--border); max-width: 200px;
        }

        /* ===== 关于我 ===== */
        .about-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 32px;
        }
        .about-card p { margin-bottom: 12px; }
        .about-card p:last-child { margin-bottom: 0; }

        /* ===== 技能标签 ===== */
        .skills-grid {
            display: flex; flex-wrap: wrap; gap: 10px;
        }
        .skill-tag {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 20px; padding: 8px 18px;
            font-size: 0.9rem; color: var(--text-dim);
            transition: all 0.25s; cursor: default;
        }
        .skill-tag:hover {
            border-color: var(--accent); color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* ===== 项目卡片 ===== */
        .projects-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        .project-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 28px;
            transition: transform 0.25s, box-shadow 0.25s;
            text-decoration: none; color: var(--text); display: block;
        }
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px var(--accent-glow);
            border-color: var(--accent);
        }
        .project-card h3 { font-size: 1.1rem; margin-bottom: 8px; }
        .project-card p {
            color: var(--text-dim); font-size: 0.9rem; line-height: 1.6;
        }
        .project-card .tag-row {
            display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px;
        }
        .project-card .mini-tag {
            font-size: 0.75rem; padding: 3px 10px;
            border-radius: 10px; background: rgba(108, 99, 255, 0.15);
            color: var(--accent);
        }

        /* ===== 联系 ===== */
        .contact-links {
            display: flex; flex-wrap: wrap; gap: 16px;
        }
        .contact-link {
            display: flex; align-items: center; gap: 10px;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 14px 22px;
            text-decoration: none; color: var(--text);
            transition: all 0.25s; font-size: 0.95rem;
        }
        .contact-link:hover {
            border-color: var(--accent); color: var(--accent);
        }
        .contact-link svg { width: 20px; height: 20px; flex-shrink: 0; }

        /* ===== Footer ===== */
        footer {
            text-align: center; padding: 40px 0 30px;
            color: var(--text-dim); font-size: 0.85rem; opacity: 0.6;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            nav { justify-content: center; gap: 20px; }
            .hero { padding: 60px 0 40px; }
            .section { padding: 40px 0; }
            .projects-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- 星空 -->
    <canvas class="stars" id="stars"></canvas>

    <div class="container">
        <!-- 导航 -->
        <nav>
            <a href="#projects">项目</a>
            <a href="#contact">联系</a>
        </nav>

        <!-- Hero -->
        <header class="hero">
            <h1>w1nterxt</h1>
            <p class="tagline">CS 在读。写代码、搭东西，能用脚本解决的绝不动手。</p>
        </header>

        <!-- 项目 -->
        <section class="section" id="projects">
            <h2 class="section-title">做过的东西</h2>
            <div class="projects-grid">
                <!-- 圣诞小玩具 -->
                <a href="https://github.com/w1nterxt/Supreise-For-Ymm" class="project-card" target="_blank">
                    <h3>Merry Christmas</h3>
                    <p>一个圣诞主题的互动页面。</p>
                    <div class="tag-row">
                        <span class="mini-tag">HTML</span>
                        <span class="mini-tag">CSS</span>
                        <span class="mini-tag">动画</span>
                    </div>
                </a>

                <!-- 占位卡片 — 方便后续添加 -->
                <div class="project-card" style="border-style: dashed; opacity: 0.5;">
                    <h3>新项目占位</h3>
                    <p>下一个有趣的项目会出现在这里。</p>
                    <div class="tag-row">
                        <span class="mini-tag">Coming Soon</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 联系 -->
        <section class="section" id="contact">
            <h2 class="section-title">找到我</h2>
            <div class="contact-links">
                <a href="https://github.com/w1nterxt" class="contact-link" target="_blank">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.385-1.335-1.755-1.335-1.755-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.605-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12 24 5.37 18.63 0 12 0z"/></svg>
                    GitHub
                </a>
                <a href="mailto:534727951@qq.com" class="contact-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                    Email
                </a>
            </div>
        </section>

        <!-- Footer -->
        <footer>
            <p>&copy; 2026 w1nterxt — Built with &hearts; and plain HTML</p>
        </footer>
    </div>

    <!-- 星空脚本 -->
    <script>
    (function() {
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        let stars = [];
        const count = 100;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function createStars() {
            stars = [];
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 1.5 + 0.5,
                    speed: Math.random() * 0.3 + 0.1,
                    opacity: Math.random(),
                    pulse: Math.random() * Math.PI * 2
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (const s of stars) {
                s.pulse += 0.01;
                const alpha = 0.3 + 0.4 * Math.sin(s.pulse);
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fill();

                // 偶尔画十字星芒
                if (s.r > 1.2) {
                    ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.3})`;
                    ctx.lineWidth = 0.5;
                    ctx.beginPath();
                    ctx.moveTo(s.x - s.r * 3, s.y);
                    ctx.lineTo(s.x + s.r * 3, s.y);
                    ctx.moveTo(s.x, s.y - s.r * 3);
                    ctx.lineTo(s.x, s.y + s.r * 3);
                    ctx.stroke();
                }
            }
            requestAnimationFrame(draw);
        }

        resize();
        createStars();
        draw();
        window.addEventListener('resize', () => { resize(); createStars(); });
    })();
    </script>
</body>
</html>
